<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *,
        *::after,
        *::before {
            margin: 0;
            padding: 0;

            box-sizing: border-box;
        }


        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1628;
            font-family: sans-serif;
        }

        .card {
            width: 250px;
            height: 300px;

            margin: 0 auto;
            background: #010c1d;
            border-radius: 8px;
            position: relative;

        }

        .tools {
            display: flex;
            align-items: center;
            padding: 9px;

        }

        .circle {
            padding: 0 4px;
        }

        .box {
            display: inline-block;
            align-items: center;
            width: 10px;
            aspect-ratio: 1/1;
            padding: 1px;
            border-radius: 50%;
        }


        .red {
            background-color: red;
        }


        .yellow {
            background-color: yellow;
        }


        .green {
            background-color: green;
        }
    </style>



    <style>
        .card::before {
            content: "";
            position: absolute;
            width: calc(101% + 1px);
            height: calc(101% + 1px);

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: inherit;


            z-index: -10;


            background: linear-gradient(var(--rotation), transparent 15%, #00eaff, #00b4ff, transparent 85%);


            animation: spin 5s linear infinite;
        }


        @property --rotation {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: true;
        }

        @keyframes spin {
            from {
                --rotation: 0deg;
            }

            to {
                --rotation: 360deg;
            }
        }
    </style>


</head>

<body>
    <div class="card">
        <div class="tools">
            <div class="circle">
                <span class="red box"></span>
            </div>
            <div class="circle">
                <span class="yellow box"></span>
            </div>
            <div class="circle">
                <span class="green box"></span>
            </div>
        </div>
        <div class="card_content"></div>
    </div>
</body>

</html>
