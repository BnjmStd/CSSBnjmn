<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            padding: 0;

            min-height: 160vh;
            overflow-x: hidden;
        }

        .container {
            background: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-block-size: 100vh;
            position: relative;

        }

        #hex-grid {
            block-size: 100vh;
            background: #000;
        }

        #hex-grid .grid {
            position: absolute;
            top: 0;
            left: 0;
            background: url(./grid.svg);
            background-repeat: repeat;

            width: 100%;
            height: 100%;

            z-index: 0;

            background-size: 500px;
        }


        #hex-grid .light {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 15em;
            height: 15em;
            filter: blur(15px);
            background: linear-gradient(90deg, #335bf4 0%, #2ae9c9 100%);

            z-index: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header id="hex-grid">
            <div class="light"></div>
            <div class="grid"></div>
        </header>
    </div>

    <script>
        const $light = document.querySelector('.light')
        const $grid = document.querySelector('#hex-grid')

        $grid.addEventListener('mousemove', (e) => {
            $light.style.left = `${e.clientX - 5}px`
            $light.style.top = `${e.clientY - 5}px`
        })
    </script>
</body>

</html>
