<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #000;
      }

      .cube {
        position: relative;

        width: 300px;
        height: 300px;


        transform-style: preserve-3d;

        transform: rotateX(-30deg);

        animation: animate 5s linear infinite;

        & > div {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;

          transform-style: preserve-3d;

          & span {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: linear-gradient(#151515, #00ec00);
            transform: rotateY(calc(90deg * var(--i))) translateZ(150px);
          }
        }
      }

      .top {
        position: absolute;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background: linear-gradient(#151515, #00ec00);
        transform: rotateX(90deg) translateZ(150px);


        &::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;

            width: 300px;
            height: 300px;
            filter: blur(40px);
            background: #0f0;
            transform: translateZ(-380px);

            box-shadow: 0 0 120px rgba(0, 255, 0, 0.2)
        }
      }

      @keyframes animate {
        0% {
          transform: rotateX(-30deg) rotateY(0deg);
        }
        100% {
          transform: rotateX(-30deg) rotateY(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="cube">
      <div class="top"></div>
      <div>
        <span style="--i: 1"></span>
        <span style="--i: 2"></span>
        <span style="--i: 3"></span>
        <span style="--i: 4"></span>
      </div>
    </div>
  </body>
</html>
