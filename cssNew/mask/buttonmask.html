<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    /* https://www.youtube.com/watch?v=WnIC9Khdd9Q */

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1f2937;
        }

        h2 {
            color: #fff;
            font-size: 52px;
            margin-bottom: 15px;
            font-weight: 300;
        }

        p {
            color: #878787;
            font-size: 26px;
            margin-bottom: 35px;
        }

        .feh-shiny-border {
            position: relative;

            padding: 20px 32px;

            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 500;

            font-size: 18px;
            background: #1f1f1f;


            transition: all 0.3s ease;

            overflow: hidden;


            &:hover {
                background: #333;
            }
        }

        .feh-border-mask {
            position: absolute;

            width: 100%;
            top: 0;
            left: 0;
            height: 100%;

            border-radius: 12px;

            padding: 1px;

            mask: linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0) border-box;

            mask-composite: exclude;
            -webkit-mask-composite: xor;
        }

        .feh-border-glow {
            position: absolute;
            background: conic-gradient(from 0deg,
                    transparent 0%,
                    #fff 10%,
                    #000 15%,
                    transparent 20%);


            top: 50%;
            left: 50%;
            width: 500px;
            height: 500px;
            transform: translate(-50%, -50%);



            transform-origin: 0 0;


            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg) translate(-50%, -50%);
            }

            100% {
                transform: rotate(360deg) translate(-50%, -50%);
            }
        }
    </style>
</head>

<body>

    <h2>leave the rest get the best</h2>
    <p>don't just accept mediocrity, choose better</p>


    <a href="#" class="feh-shiny-border">
        <div class="feh-border-mask">
            <div class="feh-border-glow">
            </div>
        </div>
        Contact us today
    </a>

</body>

</html>
