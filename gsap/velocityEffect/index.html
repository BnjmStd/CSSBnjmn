<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        color-scheme: dark;

        --bg: #0a0a0a;
        --ink: #f0ede6;
        --accent: #ff0000;

        --muted: rgba(255, 255, 255, 0.1);
        --border: rgba(240, 237, 230, 0.07);
        --row-h: clamp(80px, 11vw, 130px);
      }

      html,
      body {
        block-size: 100%;
      }

      body {
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 2px, transparent 2px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.04) 2px,
            transparent 2px
          ),
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);

        background-size:
          100px 100px,
          100px 100px,
          20px 20px,
          20px 20px;
        background-position:
          -2px -2px,
          -2px -2px,
          -1px -1px,
          -1px -1px;

        color: var(--ink);
        overflow-x: hidden;
        font-family: monospace;
      }

      *,
      *::after,
      *::before {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      .hero {
        min-block-size: 100svh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 4vw;
        position: relative;
      }

      .hero__eyebrow {
        font-size: 0.65rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 2.5rem;
      }

      .hero__title {
        font-family: sans-serif;
        line-height: 0.86;
        letter-spacing: 0.01em;
        color: transparent;
        -webkit-text-stroke: 1.5px var(--ink);

        & .solid {
          color: var(--ink);
          -webkit-text-stroke: 0px;
        }

        & .accent {
          color: var(--accent);
          -webkit-text-stroke: 0px;
        }

        .hero__desc {
          margin-top: 2.5rem;
          font-size: 0.7rem;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          display: flex;

          align-items: center;
          justify-content: center;
          gap: 1rem;
          color: var(--muted);

          &::after,
          &::before {
            content: "";
            width: 36px;
            height: 1px;
            background-color: var(--muted);
          }
        }
      }
      .scroll-cue {
        position: absolute;
        bottom: 2.5rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 0.65rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .scroll-cue__bar {
        width: 2px;
        height: 16px;
        background: linear-gradient(to bottom, var(--accent), transparent);

        transform-origin: top;

        animation: grow 1.8s ease-out infinite;
      }

      @keyframes grow {
        0% {
          transform: scaleY(0);
          opacity: 1;
        }
        70% {
          transform: scaleY(1);
          opacity: 1;
        }
        100% {
          transform: scaleY(1);
          opacity: 0;
        }
      }

      .marquee-section {
        padding-block: 5rem;
        padding-inline: 0;

        position: relative;

        border-top: 1px solid var(--border);

        border-bottom: 1px solid var(--border);

        &::after,
        &::before {
          content: "";
          position: absolute;
          top: 0;

          height: 100%;
          width: min(180px, 15vw);
          z-index: 3;

          pointer-events: none;
        }

        &::before {
          left: 0;
          background: linear-gradient(90deg, var(--bg), transparent);
        }

        &::after {
          right: 0;
          background: linear-gradient(-90deg, var(--bg), transparent);
        }
      }

      .m-row {
        height: var(--row-h);
        display: flex;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      .m-row + .m-row {
        border-top: 1px solid var(--border);
      }

      .m-row__badge {
        position: absolute;
        left: 1.2rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.55rem;
        letter-spacing: 0.2em;
        color: var(--muted);
        z-index: 4;
        opacity: 0.5;
        pointer-events: none;
      }

      .m-track {
        display: flex;
        align-items: center;
        white-space: nowrap;
        will-change: transform;
        flex-shrink: 0;
      }

      .m-word {
        font-family: sans-serif;
        font-size: clamp(3rem, 7.5vw, 8rem);
        line-height: 1;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        padding: 0 clamp(1.2rem, 2.5vw, 2.5rem);

        user-select: none;
        flex-shrink: 0;
        color: var(--ink);
        transition: color 0.3s ease;

        &.--accent {
          color: var(--accent);
        }

        &.--outline {
          color: transparent;
          -webkit-text-stroke: 1.2px rgba(240, 237, 230, 0.35);
        }
      }

      .m-sep {
        font-size: clamp(0.6rem, 1.2vw, 1rem);
        color: var(--muted);
        flex-shrink: 0;
        padding-block: 0;
        padding-inline: 0.3rem;
        user-select: none;
      }

      .hud {
        position: fixed;
        bottom: 1.8rem;
        right: 1.8rem;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
        pointer-events: none;
      }

      .hud__label {
        font-size: 0.65rem;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .hud__track {
        width: 180px;
        height: 6px;
        background-color: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }
      .hud__fill {
        height: 100%;
        background-color: var(--accent);
        width: 0;
        border-radius: 2px;
      }

      .hud__val {
        font-size: 0.58rem;
        letter-spacing: 0.1em;
        color: var(--accent);
        font-variant-numeric: tabular-nums;

        min-width: 72px;

        text-align: right;
      }

      .outro {
        min-height: 85svh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 4vw;
      }

      .outro__heading {
        font-family: sans-serif;
        font-size: clamp(2rem, 6vw, 5rem);
        line-height: 1.1;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        max-width: 16ch;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div>
        <p class="hero__eyebrow">GSAP SCROLLTRIGGER PIXEL PERFECT</p>

        <h1 class="hero__title">
          <span class="solid">SCROLL</span><br /><span class="accent"
            >VELOCITY</span
          ><br /><span class="">MARQUEE</span>
        </h1>
        <p class="hero__desc">Scroll fast - feel the difference</p>
      </div>
      <div class="scroll-cue">
        <div class="scroll-cue__bar"></div>
        scroll
      </div>

      <div class="marquee-section" id="marqueeSection">
        <div class="m-row" id="row0">
          <div class="m-track" id="track0"></div>
          <span class="m-row__badge">01</span>
        </div>
        <div class="m-row" id="row1">
          <div class="m-track" id="track1"></div>
          <span class="m-row__badge">02</span>
        </div>
        <div class="m-row" id="row2">
          <div class="m-track" id="track2"></div>
          <span class="m-row__badge">03</span>
        </div>
        <div class="m-row" id="row3">
          <div class="m-track" id="track3"></div>
          <span class="m-row__badge">04</span>
        </div>
      </div>

      <div class="outro">
        <div>
          <h2 class="outro__heading">
            SPEED IS A <em>DESIGN</em>
            DECISION
          </h2>

          <div class="outro__meta">
            <div class="outro__pip"></div>
            <span>Pixel Perfect Labs</span>
            <div class="outro__pip"></div>
            <span>Gsap Master Playlist</span>
            <div class="outro__pip"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="hud">
      <span class="hud__label">scroll velocity</span>

      <div class="hud__track">
        <div class="hud__fill" id="hudfill"></div>
      </div>
      <span class="hud__val" id="hudVal">0 px/s</span>
    </div>
  </body>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</html>
